dataset_grad: experiments/01_drift_baseline/dataset_gradual
dataset_sudden: experiments/01_drift_baseline/dataset_sudden
index_path: experiments/01_drift_baseline/index.bin
ef_values: [32, 64, 128]
k: 10
primary_ef: 32

# EH adapter params (from exp08 / exp25 for comparison)
eh_window_size: 500
eh_M_candidates: 32
eh_ef_repair: 200
eh_cooldown: 0
eh_M_conj: 48
eh_n_cells: 100
eh_n_rff: 256
eh_max_total_edges: 500000
eh_hot_cell_lambda: 2.0
eh_n_calibration_epochs: 5
eh_max_repair_nodes: 500
eh_threshold_percentile: 75.0
eh_rng_relaxation: 0
eh_two_hop: true

# Layer0 adapter params 
l0_hot_k: 50
l0_ef_repair: 200
l0_n_neighbors: 16

# Drift phase boundaries for plot annotations
drift_transition_epochs_gradual: [5, 10, 15, 20]
drift_transition_epochs_sudden: [12]

results_path: experiments/26_layer0_injection/results.csv
plots_dir: experiments/26_layer0_injection/plots
