data:
  base_path: /scratch/easchman/thesis/data/sift/sift_learn.fvecs
  query_path: /scratch/easchman/thesis/data/sift/sift_query.fvecs
  n_base: 5000000
  n_queries_pool: 10000

drift:
  seed: 42
  epoch_size: 500
  n_epochs: 25
  schedule_gradual:
    - 0.0
    - 0.0
