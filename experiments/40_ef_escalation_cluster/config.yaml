# Experiment 40: per-query ef escalation on DEEP-96 cluster drift.
# Reuses exp16/exp30 index and datasets. Four conditions:
#   static, adaptive_eh (conjugate M_conj=48), ef_escalation_2x, ef_escalation_4x, oracle_ef128.

# Dataset — reuse exp30 / exp16 exactly (DEEP-96 cluster-reweighted drift)
dataset_grad:   experiments/16_deep_cluster_drift/dataset_gradual
dataset_sudden: experiments/16_deep_cluster_drift/dataset_sudden
index_path:     experiments/16_deep_cluster_drift/index.bin

# Evaluation
k: 10
ef_values: [32, 64, 128]
primary_ef: 32

# EH detector — identical to exp30 for direct comparability
eh_window_size: 500
eh_n_cells: 100
eh_n_rff: 256
eh_hot_cell_lambda: 2.0
eh_n_calibration_epochs: 5
eh_threshold_percentile: 75.0

# Conjugate EH (adaptive_eh condition — same as exp30)
eh_M_candidates: 32
eh_ef_repair: 200
eh_cooldown: 0
eh_M_conj: 48
eh_max_total_edges: 500000
eh_max_repair_nodes: 500
eh_rng_relaxation: 0
eh_two_hop: true

# EfEscalationAdapter
ef_escalation_factors: [2, 4]
ef_oracle: 128

# Plot annotations — exp16/exp30 schedule
drift_transition_epochs_gradual: [5, 15]
drift_transition_epochs_sudden: [13]

# Output
results_gradual: experiments/40_ef_escalation_cluster/results_gradual.csv
results_sudden:  experiments/40_ef_escalation_cluster/results_sudden.csv
plots_dir:       experiments/40_ef_escalation_cluster/plots
