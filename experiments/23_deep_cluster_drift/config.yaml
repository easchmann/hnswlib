index:
  M: 16
  ef_construction: 200
  seed: 1234
  space: l2
  num_threads: 32
  path: experiments/23_deep_cluster_drift/index.bin

adaptation:
  window_size: 500
  n_cells: 100
  n_rff: 256
  max_total_edges: 500000
  M_candidates: 32
  ef_repair: 200
  rng_relaxation: 0
  hot_cell_lambda: 2.0
  n_calibration_epochs: 6
  max_repair_nodes: 500
  eh_threshold_percentile: 75.0
  repair_cooldown: 0
  two_hop: true
  diversity: false
  bridge_repair_enabled: false
  recalibration_enabled: false

conditions:
  - name: static
    method: static
  - name: adaptive_mconj48
    method: adaptive
    M_conj: 48

eval:
  ef_search_values: [16, 32, 64, 128]
  primary_ef: 32
  recall_k: 10
  diagnostic_ef_values: [8, 16, 32, 64]

output:
  dataset_gradual_path: experiments/23_deep_cluster_drift/dataset_gradual
  dataset_sudden_path: experiments/23_deep_cluster_drift/dataset_sudden
  results_dir: experiments/23_deep_cluster_drift
