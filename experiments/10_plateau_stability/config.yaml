index:
  M: 16
  ef_construction: 200
  seed: 1234

adaptation:
  window_size: 500
  n_cells: 100
  n_rff: 256
  max_total_edges: 500_000
  M_candidates: 32
  ef_repair: 200
  rng_relaxation: 0
  hot_cell_lambda: 2.0
  n_calibration_epochs: 5
  max_repair_nodes: 500
  eh_threshold_percentile: 75.0
  repair_cooldown: 0
  two_hop: true
  diversity: false
  M_conj: 48

eval:
  ef_search_values: [32, 64, 128]
  primary_ef: 32
  recall_k: 10
  k_groundtruth: 100

output:
  dataset_sudden_plateau_path: results/10_plateau_stability/dataset_sudden_plateau
  dataset_gradual_plateau_path: results/10_plateau_stability/dataset_gradual_plateau
