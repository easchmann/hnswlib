dataset_grad:   experiments/01_drift_baseline/dataset_gradual
dataset_sudden: experiments/01_drift_baseline/dataset_sudden
index_path:     experiments/01_drift_baseline/index.bin
ef_values: [32, 64, 128]
k: 10
primary_ef: 32

# Shared EH detector params — identical to exp27/exp28
eh_window_size: 500
eh_n_cells: 100
eh_n_rff: 256
eh_hot_cell_lambda: 2.0
eh_n_calibration_epochs: 5

# Conjugate EH params — identical to exp27/exp28
eh_M_candidates: 32
eh_ef_repair: 200
eh_cooldown: 0
eh_M_conj: 48
eh_max_total_edges: 500000
eh_max_repair_nodes: 500
eh_threshold_percentile: 75.0
eh_rng_relaxation: 0
eh_two_hop: true

# Layer-1-native adapter params
l1n_inject_level: 1
l1n_k_src: 50
l1n_k_dst: 32
l1n_cooldown: 0

drift_transition_epochs_gradual: [5, 10, 15, 20]
drift_transition_epochs_sudden: [12]

results_gradual: experiments/29_layer1_native/results_gradual.csv
results_sudden:  experiments/29_layer1_native/results_sudden.csv
plots_dir:       experiments/29_layer1_native/plots
