dataset_grad:   experiments/16_deep_cluster_drift/dataset_gradual
dataset_sudden: experiments/16_deep_cluster_drift/dataset_sudden
index_path:     experiments/16_deep_cluster_drift/index.bin

k: 10
ef_values: [32, 64, 128]
primary_ef: 32

# ef escalation conditions — sliding-window ratio gate
# gap_history deque of maxlen=2*slide_window_size; first half = lagged, second half = recent
# gate opens when mean(recent) / mean(lagged) > slide_ratio_threshold AND len >= 2*slide_window_size
# no calibration phase — self-normalising; designed to detect gradual drift where the ratio gate fails
ef_low: 32
ef_escalated: 64
ef_high: 256
n_gateway: 20
p_calib: 0.10              # fraction of queries always running ef_high
slide_window_size: 150     # each half of the gap_history deque (total history = 2 × this)
slide_ratio_threshold: 1.2 # gate opens when mean(recent) / mean(lagged) > this

# adaptive_eh — identical to exp45/46/47/49/50 for direct comparability
eh_window_size: 500
eh_n_cells: 100
eh_n_rff: 256
eh_hot_cell_lambda: 2.0
eh_n_calibration_epochs: 5
eh_M_candidates: 32
eh_ef_repair: 200
eh_cooldown: 0
eh_M_conj: 48
eh_max_total_edges: 500000
eh_max_repair_nodes: 500
eh_threshold_percentile: 75.0
eh_rng_relaxation: 0
eh_two_hop: true

drift_transition_epochs_gradual: [5, 15]
drift_transition_epochs_sudden: [13]

results_gradual: experiments/51_slide_gate/results_gradual.csv
results_sudden:  experiments/51_slide_gate/results_sudden.csv
plots_dir:       experiments/51_slide_gate/plots
