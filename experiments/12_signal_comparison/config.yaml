index:
  M: 16
  ef_construction: 200
  seed: 1234

adaptation:
  window_size: 500
  n_cells: 100
  n_rff: 256
  max_total_edges: 500_000
  M_conj: 48
  M_candidates: 32
  ef_repair: 200
  rng_relaxation: 0
  hot_cell_lambda: 2.0
  n_calibration_epochs: 5
  max_repair_nodes: 500
  eh_threshold_percentile: 75.0
  repair_cooldown: 0
  two_hop: true
  diversity: false

signals:
  - eh
  - qrd
  - nnd
  - csr
  - joint

eval:
  ef_search: 32
  recall_k: 10

drift_threshold_for_roc: 0.85

output:
  dataset_gradual_path: experiments/01_drift_baseline/dataset_gradual
  index_path: experiments/01_drift_baseline/index.bin
  results_dir: results/12_signal_comparison
