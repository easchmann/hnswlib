index:
  M: 16
  ef_construction: 200
  seed: 1234

adaptation:
  window_size: 500
  n_cells: 100
  n_rff: 256
  max_total_edges: 500_000
  M_candidates: 32
  ef_repair: 200
  rng_relaxation: 0
  hot_cell_lambda: 2.0
  n_calibration_epochs: 5
  max_repair_nodes: 500
  eh_threshold_percentile: 75.0
  repair_cooldown: 0
  two_hop: true
  diversity: false
  bridge_repair_enabled: false
  recalibration_enabled: false

conditions:
  - name: adaptive_mconj48
    method: adaptive
    M_conj: 48
    entry_point_adaptation: false

  - name: adaptive_mconj48_ep
    method: adaptive
    M_conj: 48
    entry_point_adaptation: true

eval:
  ef_search_values: [32, 64, 128]
  primary_ef: 32
  recall_k: 10

output:
  dataset_gradual_path: experiments/01_drift_baseline/dataset_gradual
  dataset_sudden_path: experiments/01_drift_baseline/dataset_sudden
  index_path: experiments/01_drift_baseline/index.bin
  results_dir: results/14_entry_point_adaptation
