dataset_grad:   experiments/01_drift_baseline/dataset_gradual
dataset_sudden: experiments/01_drift_baseline/dataset_sudden
index_path:     experiments/01_drift_baseline/index.bin
ef_values: [32, 64, 128]
k: 10
primary_ef: 32

# Shared EH detector params — identical to exp27 for direct comparability
eh_window_size: 500
eh_n_cells: 100
eh_n_rff: 256
eh_hot_cell_lambda: 2.0
eh_n_calibration_epochs: 5

# Conjugate EH params — identical to exp27
eh_M_candidates: 32
eh_ef_repair: 200
eh_cooldown: 0
eh_M_conj: 48
eh_max_total_edges: 500000
eh_max_repair_nodes: 500
eh_threshold_percentile: 75.0
eh_rng_relaxation: 0
eh_two_hop: true

# Layer-0 params — identical to exp27
l0_M_candidates: 32
l0_ef_repair: 200
l0_cooldown: 0
l0_max_repair_nodes: 500
l0_threshold_percentile: 75.0
l0_rng_relaxation: 0
l0_two_hop: true

# Upper-layer params
lN_inject_level: 1
lN_M_candidates: 32
lN_ef_repair: 200
lN_cooldown: 0
lN_max_repair_nodes: 500
lN_threshold_percentile: 75.0

drift_transition_epochs_gradual: [5, 10, 15, 20]
drift_transition_epochs_sudden: [12]

results_gradual: experiments/28_upper_layer_injection/results_gradual.csv
results_sudden:  experiments/28_upper_layer_injection/results_sudden.csv
plots_dir:       experiments/28_upper_layer_injection/plots
